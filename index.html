<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CAMPUS OS</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #09090b; --surface: #18181b; --line: #27272a;
    --fg: #fafafa; --mut: #a1a1aa; --acc: #3b82f6;
    --green: #22c55e; --orange: #f59e0b; --red: #ef4444; --purple: #a855f7;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: 'Inter', sans-serif; }
  h1, h2, h3, .brand { font-family: 'Space Grotesk', sans-serif; }
  
  /* Auth Screen */
  #auth-screen { position: fixed; inset: 0; background: var(--bg); z-index: 999; display: none; align-items: center; justify-content: center; padding: 20px; }
  .auth-box { width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 32px 24px; }
  .input-group { margin-bottom: 16px; }
  .input-group label { display: block; font-size: 13px; color: var(--mut); margin-bottom: 6px; }
  .input-group input { width: 100%; background: var(--bg); border: 1px solid var(--line); color: var(--fg); padding: 12px; border-radius: 8px; font-size: 15px; outline: none; transition: border-color 0.2s; }
  .input-group input:focus { border-color: var(--acc); }
  .auth-err { color: var(--red); font-size: 13px; margin-bottom: 16px; min-height: 18px; }
  .auth-switch { text-align: center; margin-top: 16px; font-size: 13px; color: var(--mut); }
  .auth-switch span { color: var(--acc); cursor: pointer; font-weight: 600; }
  .avatar-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 8px; margin-bottom: 16px; }
  .avatar-option { aspect-ratio: 1; background: var(--bg); border: 2px solid var(--line); border-radius: 50%; display: grid; place-items: center; font-size: 24px; cursor: pointer; transition: all 0.2s; }
  .avatar-option.selected { border-color: var(--acc); background: rgba(59,130,246,0.2); }

  /* App Layout */
  .app-container { max-width: 600px; margin: 0 auto; padding: 24px 16px 80px; display: none; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; }
  .brand { font-size: 24px; font-weight: 700; }
  .brand span { color: var(--acc); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .card-title { font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--mut); margin: 0; }
  .live-dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%; box-shadow: 0 0 10px var(--green); animation: pulse 2s infinite; }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
  
  /* Squad List */
  .squad-list { display: flex; flex-direction: column; gap: 12px; }
  .squad-item { display: flex; align-items: center; gap: 12px; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--line); display: grid; place-items: center; font-weight: 600; position: relative; font-size: 20px; }
  .status-dot { position: absolute; bottom: 0; right: 0; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--surface); }
  .status-dot.green { background: var(--green); }
  .status-dot.orange { background: var(--orange); }
  .status-dot.red { background: var(--red); }
  .status-dot.purple { background: var(--purple); }
  .squad-info { flex: 1; }
  .squad-name { font-weight: 600; font-size: 15px; }
  .squad-status { font-size: 13px; color: var(--mut); }

  /* Buttons & Modal */
  .btn { background: var(--acc); color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; width: 100%; transition: background 0.2s; }
  .btn:hover { background: #2563eb; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 100; }
  .modal-overlay.on { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; width: min(400px, 90vw); }
  .modal h2 { margin: 0 0 16px; font-size: 20px; }
  .status-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .status-btn { background: var(--bg); border: 1px solid var(--line); color: var(--fg); padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 500; display: flex; align-items: center; gap: 8px; }
  .status-btn:hover { border-color: var(--acc); }
</style>
</head>
<body>

<!-- Auth Screen -->
<div id="auth-screen">
  <div class="auth-box">
    <h2 class="brand" style="text-align:center; margin-bottom:24px;">CAMPUS<span>OS</span></h2>
    <div class="auth-err" id="auth-err"></div>
    
    <div class="input-group">
      <label>Username</label>
      <input type="text" id="auth-username" placeholder="e.g. ahmed_h">
    </div>
    
    <div class="input-group">
      <label>Password (min 8 chars)</label>
      <input type="password" id="auth-password" placeholder="••••••••">
    </div>

    <div id="signup-extras" style="display: none;">
      <label style="display:block; font-size:13px; color:var(--mut); margin-bottom:6px;">Choose a Profile Picture</label>
      <div style="display:flex; align-items:center; gap:16px; margin-bottom:16px;">
        <div id="avatar-preview" style="width:60px; height:60px; border-radius:50%; background:var(--line); display:grid; place-items:center; font-size:24px; background-size:cover; background-position:center;">📷</div>
        <input type="file" id="avatar-upload" accept="image/*" style="display:none;" onchange="previewImage(event)">
        <button type="button" class="btn" style="width:auto; padding:8px 16px; background:var(--line);" onclick="document.getElementById('avatar-upload').click()">Upload Image</button>
      </div>
    </div>

    <button class="btn" id="auth-submit" onclick="handleAuth()">Log In</button>
    
    <div class="auth-switch">
      <span id="auth-switch-text">Don't have an account?</span> 
      <span onclick="toggleAuthMode()" id="auth-switch-btn">Sign Up</span>
    </div>
  </div>
</div>

<!-- App Screen -->
<div class="app-container" id="app-container">
  <header>
    <div class="brand" id="app-brand">CAMPUS<span>OS</span></div>
  </header>

  <div class="card">
    <div class="card-header">
      <h2 class="card-title">Campus Radar</h2>
      <div class="live-dot"></div>
    </div>
    <div style="display:flex; gap:8px; margin-bottom:16px;">
      <input type="text" id="radar-input" placeholder="What's happening on campus?" maxlength="60" style="flex:1; background:var(--bg); border:1px solid var(--line); color:var(--fg); padding:10px; border-radius:8px; font-size:14px; outline:none;">
      <button class="btn" style="width:auto; padding:0 16px;" onclick="postRadar()">Post</button>
    </div>
    <div id="radarFeed">
      <div class="radar-item" style="color:var(--mut); font-size:13px; text-align:center; padding:10px;">Radar loading...</div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <h2 class="card-title">Who's Free?</h2>
    </div>
    <div class="squad-list">
      <!-- Populated by JS -->
    </div>
  </div>

  <div class="card">
    <button class="btn" onclick="openStatusModal()">Update My Status</button>
  </div>
</div>

<!-- Status Modal -->
<div class="modal-overlay" id="statusModal">
  <div class="modal">
    <h2>What are you up to?</h2>
    <div class="status-options">
      <button class="status-btn" onclick="setStatus('Free to hang out', 'green')">🟢 Free</button>
      <button class="status-btn" onclick="setStatus('Studying', 'orange')">🟠 Studying</button>
      <button class="status-btn" onclick="setStatus('In Class', 'red')">🔴 In Class</button>
      <button class="status-btn" onclick="setStatus('Sleeping', 'purple')">🟣 Sleeping</button>
    </div>
    <button class="btn" style="background:var(--line)" onclick="closeStatusModal()">Cancel</button>
  </div>
</div>

<script>
  const SB_URL = 'https://tqgtrkdsxnvsfzcwixlb.supabase.co';
  const SB_KEY = 'sb_publishable_qvpWVf_9AUlFzp3F5MTiEw_nu-Zp3dx';
  const sb = supabase.createClient(SB_URL, SB_KEY);

  let currentUser = null;
  let currentProfile = null;
  let isSignup = false;
 let selectedAvatarFile = null;

  const authScreen = document.getElementById('auth-screen');
  const appContainer = document.getElementById('app-container');
  const modal = document.getElementById('statusModal');

  // Avatar Selection
  // Preview the uploaded image
  function previewImage(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    // Check if it's an image and under 2MB
    if (!file.type.startsWith('image/')) {
      alert("Please select an image file.");
      return;
    }
    if (file.size > 2 * 1024 * 1024) {
      alert("Image must be less than 2MB.");
      return;
    }

    selectedAvatarFile = file;
    const reader = new FileReader();
    reader.onload = function(e) {
      const preview = document.getElementById('avatar-preview');
      preview.style.backgroundImage = `url(${e.target.result})`;
      preview.textContent = ''; // remove the camera emoji
    };
    reader.readAsDataURL(file);
  }

  function toggleAuthMode() {
    isSignup = !isSignup;
    document.getElementById('signup-extras').style.display = isSignup ? 'block' : 'none';
    document.getElementById('auth-submit').textContent = isSignup ? 'Create Account' : 'Log In';
    document.getElementById('auth-switch-text').textContent = isSignup ? 'Already have an account?' : "Don't have an account?";
    document.getElementById('auth-switch-btn').textContent = isSignup ? 'Log In' : 'Sign Up';
    document.getElementById('auth-err').textContent = '';
  }

  async function handleAuth() {
    const username = document.getElementById('auth-username').value.trim().toLowerCase();
    const password = document.getElementById('auth-password').value;
    const err = document.getElementById('auth-err');
    err.textContent = '';
    
    if (!/^[a-z0-9_]{3,15}$/.test(username)) { err.textContent = "Username: 3-15 letters/numbers"; return; }
    if (password.length < 8) { err.textContent = "Password must be 8+ characters."; return; }

    const btn = document.getElementById('auth-submit');
    btn.disabled = true;
    btn.textContent = "Please wait...";
    const fakeEmail = `${username}@campus.os`;

    try {
      if (isSignup) {
        const { data: authData, error: authError } = await sb.auth.signUp({ email: fakeEmail, password: password });
        if (authError) throw authError;
        
        let uploadedAvatarUrl = null;

        // If they uploaded a picture, send it to Supabase Storage
        if (selectedAvatarFile) {
          const fileExt = selectedAvatarFile.name.split('.').pop();
          const fileName = `${authData.user.id}-${Math.random()}.${fileExt}`;
          
          const { error: uploadError } = await sb.storage
            .from('avatars')
            .upload(fileName, selectedAvatarFile);
            
          if (!uploadError) {
            // Get the public URL for the image
            const { data: urlData } = sb.storage.from('avatars').getPublicUrl(fileName);
            uploadedAvatarUrl = urlData.publicUrl;
          }
        }

        // Save the profile with the image URL
        const { error: pErr } = await sb.from('profiles').insert({ 
          id: authData.user.id, 
          username: username, 
          avatar_url: uploadedAvatarUrl 
        });
        
        if (pErr) { if (pErr.code === '23505') throw new Error("Username is taken."); throw pErr; }
        
        enterApp(authData.user, username, uploadedAvatarUrl);
      } else {
        const { data: authData, error: authError } = await sb.auth.signInWithPassword({ email: fakeEmail, password: password });
        if (authError) throw new Error("Invalid username or password.");
        
        const { data: profile } = await sb.from('profiles').select('*').eq('id', authData.user.id).single();
        enterApp(authData.user, profile.username, profile.avatar_url);
      }
    } catch (e) {
      err.textContent = e.message;
    } finally {
      btn.disabled = false;
      btn.textContent = isSignup ? 'Create Account' : 'Log In';
    }
  }

  function enterApp(user, username, avatar) {
    currentUser = user;
    currentProfile = { name: username, avatar: avatar };
    authScreen.style.display = 'none';
    appContainer.style.display = 'block';
    document.getElementById('app-brand').innerHTML = `CAMPUS<span>OS</span> <span style="font-size:12px; color:var(--mut); margin-left:8px;">@${username}</span>`;
    loadStatuses();
    loadRadar();
    listenToDatabase();
  }

  function openStatusModal() { modal.classList.add('on'); }
  function closeStatusModal() { modal.classList.remove('on'); }

  async function setStatus(statusText, colorClass) {
    if (!currentUser) return;
    closeStatusModal();
    await sb.from('statuses').upsert({
      user_id: currentUser.id, display_name: currentProfile.name, status_text: statusText, status_color: colorClass, updated_at: new Date().toISOString()
    }, { onConflict: 'user_id' });
    loadStatuses();
  }

  async function loadStatuses() {
    const { data } = await sb.from('statuses').select('*').order('updated_at', { ascending: false });
    const squadList = document.querySelector('.squad-list');
    squadList.innerHTML = ''; 
    if (!data || data.length === 0) { squadList.innerHTML = '<div style="color:var(--mut); font-size:14px; text-align:center;">No one online yet.</div>'; return; }

    const { data: profiles } = await sb.from('profiles').select('id, avatar_url').in('id', data.map(d => d.user_id));
    const profileMap = {};
    if (profiles) profiles.forEach(p => profileMap[p.id] = p.avatar_url);

    data.forEach(person => {
      const name = person.display_name || 'Anonymous';
      const avatar = profileMap[person.user_id] || name.charAt(0).toUpperCase();
      const item = document.createElement('div');
      item.className = 'squad-item';
      // Check if it's a URL (uploaded image) or a fallback letter
      const isImage = avatar && avatar.startsWith('http');
      const avatarHTML = isImage 
        ? `<div class="avatar" style="background-image:url(${avatar}); background-size:cover; background-position:center;"></div>`
        : `<div class="avatar">${avatar}</div>`;
        
      item.innerHTML = `${avatarHTML}<span class="status-dot ${person.status_color}" style="z-index:2;"></span><div class="squad-info"><div class="squad-name">@${name}</div><div class="squad-status">${person.status_text}</div></div>`;
      squadList.appendChild(item);
    });
  }

  // --- RADAR LOGIC ---
  async function postRadar() {
    const input = document.getElementById('radar-input');
    const msg = input.value.trim();
    if (!msg || !currentUser) return;
    
    input.value = ''; // clear immediately
    await sb.from('radar').insert({
      user_id: currentUser.id,
      username: currentProfile.name,
      message: msg
    });
    loadRadar();
  }

  async function loadRadar() {
    const { data } = await sb.from('radar').select('*').order('created_at', { ascending: false }).limit(15);
    const feed = document.getElementById('radarFeed');
    feed.innerHTML = '';
    
    if (!data || data.length === 0) {
      feed.innerHTML = '<div style="color:var(--mut); font-size:13px; text-align:center; padding:10px;">No updates yet. Be the first!</div>';
      return;
    }

    data.forEach(item => {
      const time = new Date(item.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const el = document.createElement('div');
      el.className = 'radar-item';
      el.innerHTML = `
        <div class="radar-time">${time}</div>
        <div class="radar-text"><b>@${item.username}</b>: ${item.message}</div>
      `;
      feed.appendChild(el);
    });
  }

  function listenToDatabase() {
    sb.channel('campus-updates')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'statuses' }, () => loadStatuses())
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'radar' }, () => loadRadar())
      .subscribe();
  }

  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      const { data: profile } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
      if (profile) enterApp(session.user, profile.username, profile.avatar_url);
      else authScreen.style.display = 'flex';
    } else { 
      authScreen.style.display = 'flex'; 
    }
  }

  init();
</script>

</body>
</html>
